<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>回饋分析系統</title>
</head>
<body>

<h2>📊 回饋分析系統</h2>

<button onclick="loadData()">📥 查看資料</button>
<button onclick="runAI()">🤖 執行AI分析</button>

<pre id="result"></pre>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbw0GhezElgOAQdO86cCI_MDBiFly84VKV1cJLGwvUXUdIx27gOzQVvUIF1f5fpsiD8gaw/exec";

async function loadData() {
  const el = document.getElementById("result");
  el.innerText = "⏳ 載入中...";

  const res = await fetch(GAS_URL);
  const data = await res.json();

  el.innerText = JSON.stringify(data, null, 2);
}

async function runAI() {
  const el = document.getElementById("result");
  el.innerText = "⏳ 分析中...";

  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ data: "run" })
  });

  const text = await res.text();
  el.innerText = text;
}
</script>

</body>
</html>
